[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "market-data-service/tests",
    "analysis-engine/tests",
    "trade-planner/tests",
    "broker-gateway/tests",
    "personal-cio-agent/tests",
    "investment-journal/tests",
]
pythonpath = [".", "market-data-service/src", "analysis-engine/src"]

[tool.black]
target-version = ["py312"]
line-length = 88
extend-exclude = '^/deprecated/'

[tool.ruff]
target-version = "py312"
line-length = 88
src = [".", "market-data-service/src", "analysis-engine/src"]
extend-exclude = ["deprecated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
