[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#147A6C"
backgroundColor = "#FCFDFD"
secondaryBackgroundColor = "#EDF3F3"
textColor = "#163039"
font = "sans-serif"
